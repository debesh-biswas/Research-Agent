storage_backend: local
metadata_backend: sqlite
scheduler_backend: launchd
strong_model_provider: nvidia_nim
log_level: INFO
data_directory: data

concurrency:
  discovery: 3
  downloads: 4
  analysis: 2

retries:
  academic_apis: 3
  nim: 2
  classifier_repair: 1
  pdf_download: 2

models:
  local:
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    timeout_seconds: 120
    # A full paper analysis does not fit in the 2048-token default; a truncated reply is invalid
    # JSON, so this is a correctness setting rather than a tuning one.
    max_output_tokens: 4096
  nim:
    base_url: https://integrate.api.nvidia.com/v1
    model: openai/gpt-oss-20b
    timeout_seconds: 300
    max_output_tokens: 4096

classifier_a:
  deep_read_at: 0.6
  summarize_at: 0.3
  embedding_weight: 0.5
  # Set a local embedding model to blend semantic similarity into the lexical score.
  # embedding_model: nomic-embed-text

classifier_b:
  # The runtime and model come from models.local; this only bounds the prompt.
  max_abstract_chars: 2000

selection:
  # Limits (max_downloads, max_deep_reads) live per topic; these are the quality gates.
  min_relevance_score: 0.3
  require_action: true

documents:
  max_pdf_bytes: 26214400
  timeout_seconds: 60
  requests_per_second: 2
