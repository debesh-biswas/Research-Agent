storage_backend: local
metadata_backend: sqlite
scheduler_backend: launchd
strong_model_provider: nvidia_nim
log_level: INFO
data_directory: data

concurrency:
  discovery: 3
  downloads: 4
  analysis: 2

retries:
  academic_apis: 3
  nim: 2
  screening_repair: 1
  pdf_download: 2

models:
  local:
    # Served by `mlx_lm.server`, not Ollama: run
    # `mlx_lm.server --model mlx-community/Qwen3-14B-4bit --port 8080` before a local run.
    base_url: http://localhost:8080/v1
    model: mlx-community/Qwen3-14B-4bit
    # Qwen3 defaults to a "thinking" trace that starves structured JSON output of tokens.
    disable_thinking: true
    timeout_seconds: 120
    # A full paper analysis does not fit in the 2048-token default, and 4096 still truncated the
    # longest ones in a live run. A truncated reply is invalid JSON, so this is a correctness
    # setting rather than a tuning one.
    max_output_tokens: 8192
  nim:
    base_url: https://integrate.api.nvidia.com/v1
    model: openai/gpt-oss-20b
    timeout_seconds: 300
    max_output_tokens: 8192

screening:
  # NIM screens by default; the local model is used after NIM errors.
  max_abstract_chars: 2000

selection:
  # Relevance is the eligibility gate; quality orders eligible papers by recency, venue, and impact.
  min_relevance_score: 0.3
  require_action: true
  quality_weight: 0.35
  recency_window_days: 30
  preferred_venues: [CVPR, ICCV, ECCV, NeurIPS, ICML, ICLR, AAAI, IJCAI, SIGGRAPH, TPAMI, JMLR, Nature, Science]

documents:
  max_pdf_bytes: 26214400
  timeout_seconds: 60
  requests_per_second: 2
