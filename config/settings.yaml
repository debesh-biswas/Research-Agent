storage_backend: local
metadata_backend: sqlite
scheduler_backend: launchd
strong_model_provider: local
log_level: INFO
data_directory: data

concurrency:
  discovery: 3
  downloads: 4
  analysis: 2

retries:
  academic_apis: 3
  nim: 2
  classifier_repair: 1
  pdf_download: 2

models:
  local:
    base_url: http://localhost:11434/v1
    model: qwen3:8b
    timeout_seconds: 120
  nim:
    base_url: https://integrate.api.nvidia.com/v1
    model: meta/llama-3.1-70b-instruct
    timeout_seconds: 120

classifier_a:
  deep_read_at: 0.6
  summarize_at: 0.3
  embedding_weight: 0.5
  # Set a local embedding model to blend semantic similarity into the lexical score.
  # embedding_model: nomic-embed-text

classifier_b:
  # The runtime and model come from models.local; this only bounds the prompt.
  max_abstract_chars: 2000
