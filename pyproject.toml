[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "Local-first weekly AI research intelligence agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Debesh Biswas", email = "mail2debesh@gmail.com" }]
dependencies = [
  "docling>=2.130,<3",
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.9,<4",
  "typer>=0.12,<1",
]

[project.scripts]
research-agent = "research_agent.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# LangGraph's `add_node` overloads do not accept a plainly typed async node, and its own generics
# are not resolvable here; our nodes and state stay strictly typed, only the builder is opaque.
[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Docling's transitive numpy stubs cannot be parsed below 3.12, which is why the floor moved.
[[tool.mypy.overrides]]
module = ["docling", "docling.*", "docling_core", "docling_core.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=research_agent --cov-report=term-missing --cov-fail-under=85 -m 'not slow'"
testpaths = ["tests"]
markers = [
  "slow: needs the real Docling stack and, on first run, a model download. Run with -m slow.",
]

[tool.coverage.run]
branch = true
