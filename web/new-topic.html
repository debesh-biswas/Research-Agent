<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New topic · Desk</title>
    <meta name="theme-color" content="#f3f6f4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,480;7..72,650&family=Schibsted+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/desk.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="wrap">
      <header class="topbar">
        <a class="brand" href="index.html">Desk</a>
        <nav class="nav" aria-label="Desk">
          <a href="index.html">This week</a>
          <a href="new-topic.html" aria-current="page">New topic</a>
        </nav>
      </header>
      <main id="main">
        <h1>New topic</h1>
        <p class="empty">
          Name it and, optionally, describe it. The local model will suggest keywords to review
          before the topic is created and its pipeline starts.
        </p>

        <form id="topic-form" class="topic-form" novalidate>
          <div class="field">
            <label for="topic-id">Topic id</label>
            <input
              type="text"
              id="topic-id"
              name="id"
              required
              pattern="[a-z0-9_]+"
              placeholder="e.g. quantum_error_correction"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="topic-name">Name</label>
            <input
              type="text"
              id="topic-name"
              name="name"
              required
              placeholder="e.g. Quantum Error Correction"
              autocomplete="off"
            />
          </div>
          <div class="field">
            <label for="topic-description">Description <span class="quiet">(optional)</span></label>
            <textarea
              id="topic-description"
              name="description"
              rows="3"
              placeholder="What this topic covers, to guide the keyword suggestions"
            ></textarea>
          </div>
          <div class="form-actions">
            <button class="primary" type="submit" id="suggest-button">Suggest keywords</button>
          </div>
        </form>

        <div id="review" class="keyword-review" hidden>
          <h2>Suggested keywords</h2>
          <ul class="keyword-chips" id="keyword-list"></ul>
          <div class="form-actions">
            <button class="primary" id="confirm-button" type="button">
              Create topic and start pipeline
            </button>
            <button class="button" id="cancel-button" type="button">Back</button>
          </div>
        </div>

        <p id="status" class="status-line" role="status"></p>
      </main>
      <footer class="footer">Runs in the background; check "This week" once it finishes.</footer>
    </div>
    <script src="js/new-topic.js"></script>
  </body>
</html>
